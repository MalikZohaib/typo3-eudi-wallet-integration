name: t3hub/eudi-wallet-integration-form
label: 'T3Hub EUDI Wallet'
priority: 200

prototypes:
  standard:

    formEditor:

      dynamicJavaScriptModules:
        additionalViewModelModules:
          100: '@t3hub/eudi-wallet-integration/backend/form-editor/eudi-wallet.js'

    formElementsDefinition:

      Form:
        renderingOptions:
          partialRootPaths:
            20: 'EXT:eudi_wallet_integration/Resources/Private/Partials/Form/'

      #
      # ==========================================================
      # Standard TYPO3 form elements with EUDI claim property
      # ==========================================================
      #

      Text:
        properties:
          eudiClaim: ''

        formEditor:
          editors:
            500:
              identifier: eudiClaim
              templateName: Inspector-TextEditor
              label: 'EUDI Claim'
              propertyPath: properties.eudiClaim

      Email:
        properties:
          eudiClaim: ''

        formEditor:
          editors:
            900:
              identifier: eudiClaim
              templateName: Inspector-TextEditor
              label: 'EUDI Claim'
              propertyPath: properties.eudiClaim
              doNotSetIfPropertyValueIsEmpty: true

      Telephone:
        properties:
          eudiClaim: ''

        formEditor:
          editors:
            500:
              identifier: eudiClaim
              templateName: Inspector-TextEditor
              label: 'EUDI Claim'
              propertyPath: properties.eudiClaim

      Number:
        properties:
          eudiClaim: ''

        formEditor:
          editors:
            900:
              identifier: eudiClaim
              templateName: Inspector-TextEditor
              label: 'EUDI Claim'
              propertyPath: properties.eudiClaim

      Date:
        properties:
          eudiClaim: ''

        formEditor:
          editors:
            500:
              identifier: eudiClaim
              templateName: Inspector-TextEditor
              label: 'EUDI Claim'
              propertyPath: properties.eudiClaim

      DateTime:
        properties:
          eudiClaim: ''

        formEditor:
          editors:
            500:
              identifier: eudiClaim
              templateName: Inspector-TextEditor
              label: 'EUDI Claim'
              propertyPath: properties.eudiClaim

      Textarea:
        properties:
          eudiClaim: ''

        formEditor:
          editors:
            500:
              identifier: eudiClaim
              templateName: Inspector-TextEditor
              label: 'EUDI Claim'
              propertyPath: properties.eudiClaim

      Password:
        properties:
          eudiClaim: ''

        formEditor:
          editors:
            500:
              identifier: eudiClaim
              templateName: Inspector-TextEditor
              label: 'EUDI Claim'
              propertyPath: properties.eudiClaim

      Hidden:
        properties:
          eudiClaim: ''

        formEditor:
          editors:
            500:
              identifier: eudiClaim
              templateName: Inspector-TextEditor
              label: 'EUDI Claim'
              propertyPath: properties.eudiClaim

      SingleSelect:
        properties:
          eudiClaim: ''

