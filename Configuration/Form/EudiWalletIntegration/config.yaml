              label: 'EUDI Claim'
              propertyPath: properties.eudiClaim

      MultiSelect:
        properties:
          eudiClaim: ''

        formEditor:
          editors:
            500:
              identifier: eudiClaim
              templateName: Inspector-TextEditor
              label: 'EUDI Claim'
              propertyPath: properties.eudiClaim

      Checkbox:
        properties:
          eudiClaim: ''

        formEditor:
          editors:
            500:
              identifier: eudiClaim
              templateName: Inspector-TextEditor
              label: 'EUDI Claim'
              propertyPath: properties.eudiClaim

      RadioButton:
        properties:
          eudiClaim: ''

        formEditor:
          editors:
            500:
              identifier: eudiClaim
              templateName: Inspector-TextEditor
              label: 'EUDI Claim'
              propertyPath: properties.eudiClaim

      #
      # ==========================================================
      # EUDI Wallet Verification element
      # ==========================================================
      #

      EudiWalletIntegrationVerification:

        implementationClassName: TYPO3\CMS\Form\Domain\Model\FormElements\GenericFormElement

        renderingOptions:
          templateName: 'EudiWalletIntegrationVerification'
          templateRootPaths:
            10: 'EXT:eudi_wallet_integration/Resources/Private/Partials/Form/'

        properties:
          eudiConfiguration: 0
          buttonLabel: 'Verify with EUDI Wallet'
          successMessage: 'Identity verified successfully.'

        formEditor:

          label: 'EUDI Wallet Verification'
          group: custom
          groupSorting: 100
          iconIdentifier: 'form-check'

          editors:

            100:
              identifier: header
              templateName: Inspector-FormElementHeaderEditor

            200:
              identifier: label
              templateName: Inspector-TextEditor
              label: formEditor.elements.FormElement.editor.label.label
              propertyPath: label

            230:
              identifier: elementDescription
              templateName: Inspector-TextEditor
              label: formEditor.elements.FormElement.editor.elementDescription.label
              propertyPath: properties.elementDescription

            300:
              identifier: buttonLabel
              templateName: Inspector-TextEditor
              label: 'Button label'
              propertyPath: properties.buttonLabel

            400:
              identifier: eudiConfiguration
              templateName: Inspector-TextEditor
              label: 'EUDI configuration UID'
              propertyPath: properties.eudiConfiguration

            9999:
              identifier: removeButton
              templateName: Inspector-RemoveElementEditor
